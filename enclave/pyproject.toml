[project]
name = "poaw-enclave"
version = "0.1.0"
description = "Proof of Agent Work enclave guest: runs the open verifier inside an AWS Nitro Enclave and attests the decision."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nuraveda Lab" }]
dependencies = ["poaw-core", "poaw-node", "cbor2==5.9.0", "httpx>=0.27", "certifi"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
poaw-core = { path = "../core-python", editable = true }
poaw-node = { path = "../node", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poaw_enclave"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
